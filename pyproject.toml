[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldebug"
version = "0.1.0"
description = "Diagnostic checks that explain why your ML model is failing: leakage, label issues, imbalance, drift, and overfitting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["machine learning", "debugging", "data leakage", "model evaluation", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
notebook = ["ipython"]
dev = ["pytest>=7.0", "scikit-learn>=1.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/yourusername/modeldebug"
Issues = "https://github.com/yourusername/modeldebug/issues"

[tool.setuptools.packages.find]
include = ["modeldebug*"]
